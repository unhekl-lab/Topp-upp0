<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ----- reset & dasar ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #1a1a2e, #0f0f1a);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* efek latar */
        .bg-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 70, 50, 0.12), transparent 70%);
            top: -150px;
            right: -150px;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        .bg-glow-2 {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.10), transparent 70%);
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, 30px) scale(1.1);
            }
        }

        /* ----- kartu utama ----- */
        .card {
            position: relative;
            z-index: 10;
            max-width: 640px;
            width: 100%;
            background: rgba(22, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 32px 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .header .icon-badge {
            background: linear-gradient(135deg, #ff5e3a, #ff2a4a);
            width: 52px;
            height: 52px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(255, 50, 50, 0.4);
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #d0d0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header h1 span {
            font-weight: 900;
            background: linear-gradient(to right, #ffb347, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ID Player */
        .id-section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.2s;
        }
        .id-section:focus-within {
            border-color: #ff5e3a;
            box-shadow: 0 0 0 4px rgba(255, 94, 58, 0.15);
        }
        .id-section label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaac0;
            margin-bottom: 6px;
        }
        .id-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .id-input-wrap i {
            color: #ff5e3a;
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        .id-input-wrap input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            padding: 6px 0;
            font-family: 'Inter', sans-serif;
        }
        .id-input-wrap input::placeholder {
            color: #5a5a7a;
            font-weight: 500;
            font-size: 18px;
            letter-spacing: 0;
        }

        /* grid paket */
        .package-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .package-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px 6px 14px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .package-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .package-item.active {
            border-color: #ff5e3a;
            background: rgba(255, 94, 58, 0.12);
            box-shadow: 0 0 20px rgba(255, 94, 58, 0.2);
        }
        .package-item .diamond-icon {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
            display: block;
            margin-bottom: 4px;
        }
        .package-item .amount {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .package-item .price {
            font-size: 13px;
            font-weight: 600;
            color: #8a8aaa;
            margin-top: 2px;
        }
        .package-item .badge-pop {
            display: inline-block;
            background: #ff5e3a;
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .package-item .badge-best {
            background: #ffd700;
            color: #1a1a2e;
        }

        /* tombol bayar */
        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #ff5e3a, #ff2a4a);
            border: none;
            padding: 18px 20px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 30px rgba(255, 46, 46, 0.4);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .btn-pay i {
            font-size: 22px;
        }
        .btn-pay:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 46, 46, 0.6);
        }
        .btn-pay:active {
            transform: scale(0.97);
        }
        .btn-pay:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* ----- modal bukti pembayaran ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: linear-gradient(145deg, #1f1f3a, #14142a);
            border-radius: 48px;
            max-width: 440px;
            width: 100%;
            padding: 36px 32px 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 50px 80px rgba(0, 0, 0, 0.9);
            transform: scale(0.92) translateY(30px);
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .modal-overlay.open .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-box .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00c851, #00e676);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 44px;
            color: #fff;
            box-shadow: 0 12px 30px rgba(0, 200, 80, 0.4);
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-box h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .modal-box .sub {
            text-align: center;
            color: #9a9abe;
            font-weight: 600;
            margin-top: 4px;
            font-size: 15px;
        }
        .modal-box .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 20px 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
        }
        .detail-row .label {
            color: #8a8aaa;
            font-weight: 600;
        }
        .detail-row .value {
            color: #f0f0ff;
            font-weight: 700;
        }
        .detail-row .value.highlight {
            color: #ffd700;
        }
        .detail-row .value.id-highlight {
            background: rgba(255, 94, 58, 0.2);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .btn-close-modal {
            width: 100%;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 17px;
            color: #ccccee;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-close-modal:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* ----- confetti canvas ----- */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            width: 100%;
            height: 100%;
        }

        /* ----- container iklan ----- */
        .ads-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }
        .ads-container>* {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* ----- responsif ----- */
        @media (max-width: 540px) {
            .card {
                padding: 28px 18px 32px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 20px;
            }
            .package-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .package-item {
                padding: 12px 4px;
            }
            .package-item .amount {
                font-size: 15px;
            }
            .modal-box {
                padding: 28px 20px 32px;
            }
        }
        @media (max-width: 420px) {
            .package-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

    <!-- ===== SKRIP LOGIKA UTAMA (disatukan di sini) ===== -->
    <script>
        (function() {
            // ---- DOM refs ----
            const playerIdInput = document.getElementById('playerId');
            const packageItems = document.querySelectorAll('.package-item');
            const payBtn = document.getElementById('payBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalId = document.getElementById('modalId');
            const modalDiamond = document.getElementById('modalDiamond');
            const modalPrice = document.getElementById('modalPrice');
            const modalTime = document.getElementById('modalTime');
            const closeModalBtn = document.getElementById('closeModalBtn');

            let selectedDiamond = 355;
            let selectedPrice = 'Rp Geratis';

            // ---- Package selection ----
            packageItems.forEach(item => {
                item.addEventListener('click', function() {
                    packageItems.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    selectedDiamond = parseInt(this.dataset.diamond, 10);
                    selectedPrice = this.dataset.price;
                });
            });

            // ---- Format waktu ----
            function getCurrentTime() {
                const now = new Date();
                return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }

            // ---- Confetti ----
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let confettiPieces = [];
            let animationRunning = false;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class ConfettiPiece {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.w = Math.random() * 10 + 5;
                    this.h = Math.random() * 6 + 3;
                    this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    this.vy = Math.random() * 4 + 2;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                }
                update() {
                    this.y += this.vy;
                    this.x += this.vx;
                    this.rotation += this.rotationSpeed;
                    if (this.y > canvas.height + 30) {
                        this.y = -30;
                        this.x = Math.random() * canvas.width;
                        this.vy = Math.random() * 4 + 2;
                        this.vx = (Math.random() - 0.5) * 2;
                    }
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                    ctx.restore();
                }
            }

            function startConfetti(count = 150) {
                if (animationRunning) return;
                for (let i = 0; i < count; i++) {
                    confettiPieces.push(new ConfettiPiece());
                }
                animationRunning = true;
                animateConfetti();
            }

            function animateConfetti() {
                if (!animationRunning) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                for (let p of confettiPieces) {
                    p.update();
                    p.draw();
                    if (p.y < canvas.height + 30) alive = true;
                }
                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    animationRunning = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    confettiPieces = [];
                }
            }

            function stopConfetti() {
                animationRunning = false;
                confettiPieces = [];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // ---- Show modal ----
            function showPaymentProof() {
                const idValue = playerIdInput.value.trim() || 'Tidak ada ID';
                modalId.textContent = idValue;
                modalDiamond.textContent = selectedDiamond;
                modalPrice.textContent = selectedPrice;
                modalTime.textContent = getCurrentTime();

                modalOverlay.classList.add('open');
                startConfetti(150);

                payBtn.disabled = true;
                setTimeout(() => { payBtn.disabled = false; }, 3000);
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                stopConfetti();
            }

            // ---- Event listeners ----
            payBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const id = playerIdInput.value.trim();
                if (id.length < 4) {
                    playerIdInput.style.borderColor = '#ff3a3a';
                    playerIdInput.style.boxShadow = '0 0 0 4px rgba(255,50,50,0.2)';
                    setTimeout(() => {
                        playerIdInput.style.borderColor = '';
                        playerIdInput.style.boxShadow = '';
                    }, 1000);
                    return;
                }
                showPaymentProof();
            });

            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                    closeModal();
                }
            });

            // ---- Kosongkan default ----
            playerIdInput.value = '';
        })();
    </script>
